<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title description">
  <title id="title">A path through Network Notes</title>
  <desc id="description">Five stages: Foundations covers models, addressing and subnetting. Connect covers switching, routing and services. Protect covers security and gateway resilience. Expand covers monitoring, WAN, VPN, wireless and IPv6. Troubleshoot covers verification and enterprise labs.</desc>
  <rect width="1200" height="320" fill="#071421"/>
  <path d="M40 82H1160" stroke="#203345"/>
  <text x="40" y="38" fill="#80d3bd" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="3">THE LEARNING ROUTE</text>
  <text x="40" y="65" fill="#f3eddf" font-family="Segoe UI, Arial, sans-serif" font-size="20">Build from first principles. Put each layer into practice.</text>
  <path d="M60 132H1090" fill="none" stroke="#436b69" stroke-width="2"/>
  <path d="M1083 125L1090 132L1083 139" fill="none" stroke="#80d3bd" stroke-width="2"/>
  <g font-family="Segoe UI, Arial, sans-serif">
