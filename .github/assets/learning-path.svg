    <text x="60" y="138" text-anchor="middle" fill="#a0e9d6" font-size="16" font-weight="700">01</text>
    <text x="40" y="192" fill="#f3eddf" font-size="24" font-weight="600">Foundations</text>
    <text x="40" y="223" fill="#b8c8d1" font-size="17">Models · addressing</text>
    <text x="40" y="249" fill="#b8c8d1" font-size="17">Subnetting</text>

    <circle cx="288" cy="132" r="21" fill="#102932" stroke="#80d3bd" stroke-width="2"/>
    <text x="288" y="138" text-anchor="middle" fill="#a0e9d6" font-size="16" font-weight="700">02</text>
    <text x="268" y="192" fill="#f3eddf" font-size="24" font-weight="600">Connect</text>
    <text x="268" y="223" fill="#b8c8d1" font-size="17">Switching · routing</text>
    <text x="268" y="249" fill="#b8c8d1" font-size="17">Network services</text>

    <circle cx="516" cy="132" r="21" fill="#102932" stroke="#80d3bd" stroke-width="2"/>
    <text x="516" y="138" text-anchor="middle" fill="#a0e9d6" font-size="16" font-weight="700">03</text>
    <text x="496" y="192" fill="#f3eddf" font-size="24" font-weight="600">Protect</text>
    <text x="496" y="223" fill="#b8c8d1" font-size="17">Security</text>
    <text x="496" y="249" fill="#b8c8d1" font-size="17">Gateway resilience</text>

    <circle cx="744" cy="132" r="21" fill="#102932" stroke="#80d3bd" stroke-width="2"/>
    <text x="744" y="138" text-anchor="middle" fill="#a0e9d6" font-size="16" font-weight="700">04</text>
    <text x="724" y="192" fill="#f3eddf" font-size="24" font-weight="600">Expand</text>
    <text x="724" y="223" fill="#b8c8d1" font-size="17">Monitoring · WAN · VPN</text>
    <text x="724" y="249" fill="#b8c8d1" font-size="17">Wireless · IPv6</text>

    <circle cx="972" cy="132" r="21" fill="#302b24" stroke="#e6b16a" stroke-width="2"/>
    <text x="972" y="138" text-anchor="middle" fill="#f2c688" font-size="16" font-weight="700">05</text>
    <text x="952" y="192" fill="#f3eddf" font-size="24" font-weight="600">Troubleshoot</text>
